name: polaris-platform CI/CD

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "ingress/**"
      - "namespaces/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [deploy-airflow]
  workflow_dispatch: {}

env:
  HELM_VERSION: v3.15.4
  AIRFLOW_CHART_VERSION: "1.22.0"

jobs:
  # ---------------------------------------------------------------------
  # 1) YAMLLint - sintaxis y estilo de todos los YAML del repo
  # ---------------------------------------------------------------------
  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
        with:
          config_file: ".yamllint.yml"
          file_or_dir: charts ingress namespaces

  # ---------------------------------------------------------------------
  # 2) Helm Lint - valida cada chart (upstream + nuestros values.yaml)
  #    y renderiza los manifiestos finales para las etapas siguientes
  # ---------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add apache-airflow https://airflow.apache.org
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
      - name: Lint + render every chart
        run: |
          set -e
          mkdir -p rendered pulled
          declare -A CHARTS=(
            [postgresql]="bitnami/postgresql:data"
            [rabbitmq]="bitnami/rabbitmq:data"
            [airflow]="apache-airflow/airflow:airflow"
            [monitoring]="prometheus-community/kube-prometheus-stack:monitoring"
            [cert-manager]="jetstack/cert-manager:cert-manager"
            [ingress-nginx]="ingress-nginx/ingress-nginx:ingress-nginx"
          )
          # Versiones fijas por chart (evita drift entre lo que se lintea/escanea
          # aquí y lo que realmente se instala en el job "deploy"). Solo Airflow
          # tiene versión pineada por ahora; agrega más entradas si fijas otras.
          declare -A VERSIONS=(
            [airflow]="${AIRFLOW_CHART_VERSION}"
          )
          for name in "${!CHARTS[@]}"; do
            chart="${CHARTS[$name]%%:*}"
            ns="${CHARTS[$name]##*:}"
            values="charts/${name}/values.yaml"
            chart_dir_name="${chart#*/}"
            version_flag=()
            if [ -n "${VERSIONS[$name]:-}" ]; then
              version_flag=(--version "${VERSIONS[$name]}")
            fi
            echo "=== helm pull ${chart} ${VERSIONS[$name]:-latest} -> pulled/${chart_dir_name} ==="
            helm pull "${chart}" "${version_flag[@]}" --untar --untardir pulled
            echo "=== helm lint pulled/${chart_dir_name} (values: ${values}) ==="
            helm lint "pulled/${chart_dir_name}" -f "${values}"
            echo "=== helm template ${chart} -> rendered/${name}.yaml ==="
            helm template "${name}" "pulled/${chart_dir_name}" -f "${values}" -n "${ns}" > "rendered/${name}.yaml"
          done
      - name: Upload rendered manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-manifests
          path: rendered/
      - name: Checkov - Escaneo de seguridad de los manifiestos K8s
        id: checkov
        uses: bridgecrewio/checkov-action@dfb51aed1b783289b0d3f255028e7a88d5e8caa1
        with:
          directory: rendered
          framework: kubernetes
          output_format: cli,json
          output_file_path: checkov-report.txt,checkov-report.json
          soft_fail: true
        env:
          PRISMA_API_URL: https://api.prismacloud.io
      - name: Subir reporte de Checkov
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkov-report
          path: |
            checkov-report.txt
            checkov-report.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # 3) Trivy - escanea los manifiestos renderizados en busca de
  #    misconfiguraciones (privilegios, falta de resource limits, etc.)
  # 4) SonarCloud - análisis estático del repo (fusionado en este job)
  # ---------------------------------------------------------------------
  trivy:
    name: Trivy + SonarCloud
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download rendered manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rendered-manifests
          path: rendered/

      - name: Install Trivy CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy config scan (IaC misconfigs)
        run: |
          trivy config --severity CRITICAL,HIGH --exit-code 1 --ignorefile docs/trivy-ignore.yaml rendered/

      - name: Asegurar que existan los reportes antes de adjuntar
        if: always()
        run: |
          for f in checkov-report.txt checkov-report.json; do
            [ -f "$f" ] || touch "$f"
          done

      - name: Descargar reporte de Checkov (del job helm-lint)
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checkov-report
          path: .

      - name: Enviar correo con resultado de Trivy, SonarCloud y Checkov
        if: always()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI POLARIS - SonarCloud + Checkov"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI POLARIS <${{ secrets.SMTP_USERNAME }}>"
          body: "Se ejecutó el pipeline de polaris-platform (Helm/Kubernetes). Revisa los adjuntos para ver el resultado de SonarCloud y el escaneo de seguridad de Checkov sobre los manifiestos renderizados."
          attachments: |
            checkov-report.txt
            checkov-report.json

  # ---------------------------------------------------------------------
  # 5) Deploy - corre en el runner self-hosted dentro de svr-airflow,
  #    que ya tiene línea de vista al K3s API server (127.0.0.1:6443)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: [self-hosted, polaris-kubernetes]
    needs: trivy
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add apache-airflow https://airflow.apache.org
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Apply namespaces
        run: kubectl apply -f namespaces/namespaces.yaml

      - name: Deploy cert-manager + ClusterIssuer
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace -f charts/cert-manager/values.yaml --wait --timeout 5m
          kubectl apply -f charts/cert-manager/cluster-issuer.yaml

      - name: Deploy ingress-nginx
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace -f charts/ingress-nginx/values.yaml --wait --timeout 5m

      - name: Deploy monitoring (kube-prometheus-stack)
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            -n monitoring --create-namespace -f charts/monitoring/values.yaml --wait --timeout 10m

      - name: Deploy data layer (Postgres + RabbitMQ)
        run: |
          helm upgrade --install postgres bitnami/postgresql \
            -n data --create-namespace -f charts/postgresql/values.yaml \
            --version 18.11.0 --wait --timeout 10m
          helm upgrade --install rabbitmq bitnami/rabbitmq \
            -n data --create-namespace -f charts/rabbitmq/values.yaml \
            --version 16.0.14 --wait --timeout 10m

      - name: Deploy Airflow
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            -n airflow --create-namespace -f charts/airflow/values.yaml \
            --version ${{ env.AIRFLOW_CHART_VERSION }} \
            --set images.airflow.repository=ghcr.io/lopezzuluagaj3-collab/polaris-airflow \
            --set images.airflow.tag=${{ github.event.client_payload.image_tag || 'latest' }} \
            --timeout 15m

      - name: Apply Ingress rules (Grafana)
        run: kubectl apply -f ingress/ingress-rules.yaml

      - name: Verify rollout
        run: |
          set -e
          echo "=== Esperando que la migración de Airflow haya completado ==="
          if kubectl get job/airflow-run-airflow-migrations -n airflow >/dev/null 2>&1; then
            kubectl wait --for=condition=complete job/airflow-run-airflow-migrations -n airflow --timeout=120s
          else
            echo "El job ya no existe (probablemente se autoeliminó tras completarse por el hook-delete-policy de Helm) — continuando."
          fi

          echo "=== Verificando rollout de los componentes de Airflow ==="
          kubectl rollout status deployment/airflow-scheduler -n airflow --timeout=180s
          kubectl rollout status deployment/airflow-api-server -n airflow --timeout=180s
          kubectl rollout status deployment/airflow-dag-processor -n airflow --timeout=180s
          kubectl rollout status statefulset/airflow-worker -n airflow --timeout=180s
          kubectl rollout status statefulset/airflow-triggerer -n airflow --timeout=180s

          echo "=== Estado final de los pods ==="
          kubectl get pods -n data
          kubectl get pods -n airflow
          kubectl get pods -n monitoring
          kubectl get certificate -A


  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      issues: write
      contents: read
    steps:
      - name: Run OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://polari-airflow.duckdns.org'
          issue_title: 'ZAP Security Scan Report - Airflow Webserver'
          cmd_options: '-a'
          allow_issue_writing: true
          fail_action: false


