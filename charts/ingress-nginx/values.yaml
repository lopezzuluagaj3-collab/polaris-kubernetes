controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault


  admissionWebhooks:
    patch:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 2000
        capabilities:
          drop:
            - ALL
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 2000
        fsGroup: 2000


  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: https
      containerPort: 8443
      protocol: TCP
  # Mitiga ksv014: root FS de solo lectura + drop ALL capabilities.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false  # ingress-nginx necesita ser root para bind 80/443
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault
  # K3s no permite capabilities NET_BIND_SERVICE con readOnlyRootFilesystem
  # en algunos drivers, así que también subimos el puerto interno arriba.
  config:
    # Re-mapear los puertos internos que el controller escucha (no los NodePorts).
    # Esto evita que el container haga bind() sobre 80/443 directamente.
    use-proxy-protocol: "false"
