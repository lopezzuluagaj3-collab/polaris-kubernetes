controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  admissionWebhooks:
    patch:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 2000
        capabilities:
          drop:
            - ALL
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 2000
        fsGroup: 2000
  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: https
      containerPort: 8443
      protocol: TCP
  # Mitiga parcialmente ksv014: drop de capabilities + non-root donde es posible.
  # readOnlyRootFilesystem NO se activa aquí a propósito -- ver AVD-KSV-0014
  # en docs/trivy-ignore.yaml: es una limitación conocida y sin resolver del
  # chart comunitario ingress-nginx/ingress-nginx (kubernetes/ingress-nginx#6256),
  # que necesita escribir en /etc/nginx/lua/cfg.json, /tmp/nginx/, etc. en
  # tiempo de ejecución sin exponer una lista oficial de volúmenes soportados.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: false  # ingress-nginx necesita ser root para bind 80/443
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault
  config:
    use-proxy-protocol: "false"
