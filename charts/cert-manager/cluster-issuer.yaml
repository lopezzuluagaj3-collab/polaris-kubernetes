# ClusterIssuer de Let's Encrypt (producción) — pide certs automáticamente
# para cualquier Ingress que tenga la annotation cert-manager.io/cluster-issuer: letsencrypt-prod
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: lopezzuluaj3@gmail.com  
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
