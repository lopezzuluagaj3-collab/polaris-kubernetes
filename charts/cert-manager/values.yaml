# cert-manager para POLARIS - namespace: cert-manager
# Repo: helm repo add jetstack https://charts.jetstack.io
# Instalar con:
#   kubectl create namespace cert-manager
#   helm install cert-manager jetstack/cert-manager -n cert-manager -f charts/cert-manager/values.yaml
#
# Después de instalar el chart, aplica el ClusterIssuer:
#   kubectl apply -f charts/cert-manager/cluster-issuer.yaml

installCRDs: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
