# Airflow para POLARIS - namespace: airflow
# Instalar con: helm install airflow apache-airflow/airflow -n airflow -f charts/airflow/values.yaml
executor: CeleryExecutor

postgresql:
  enabled: false

redis:
  enabled: false

# -----------------------------------------------------------------------------
# Todas las credenciales viven en Secrets de Kubernetes (creados una sola vez
# con scripts/create-secrets.sh, directo en el nodo -- NUNCA en este archivo).
# Cada *SecretName apunta a un Secret con una única key llamada "connection"
# que contiene la connection string COMPLETA (usuario+password incluidos).
# -----------------------------------------------------------------------------
data:
  metadataSecretName: airflow-metadata
  resultBackendSecretName: airflow-result-backend
  brokerUrlSecretName: airflow-broker-url

fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret


dags:
  gitSync:
    enabled: true
    repo: https://github.com/lopezzuluagaj3-collab/polaris-airflow.git
    branch: main
    subPath: "dags"
    period: "30s"
    wait: 30
    maxFailures: 0
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
# apiServer.base_url debe coincidir con el host del Ingress de abajo, si no
# el redirect interno del login/JWT queda mal armado.
config:
  api:
    base_url: "https://polaris-airflow.duckdns.org"

ingress:
  enabled: true
  apiServer:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - name: polaris-airflow.duckdns.org
        tls:
          enabled: true
          # cert-manager crea este Secret solo cuando ve la annotation de
          # arriba en el Ingress -- no lo crees tú a mano.
          secretName: airflow-tls

images:
  airflow:
    pullPolicy: Always

statsd:
  enabled: false

# -----------------------------------------------------------------------------
# Hardening de seguridad (mitiga ksv014 readOnlyRootFilesystem y ksv053 pods/exec)
#
# Cada componente (apiServer, scheduler, triggerer, dagProcessor, workers)
# tiene su PROPIO securityContexts para el contenedor principal, y además
# subcomponentes (logGroomerSidecar, waitForMigrations) con SU PROPIO
# securityContexts.container independiente -- no heredan del principal.
# -----------------------------------------------------------------------------
apiServer:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  waitForMigrations:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

scheduler:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  logGroomerSidecar:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  waitForMigrations:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

triggerer:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  logGroomerSidecar:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  waitForMigrations:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

dagProcessor:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  logGroomerSidecar:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  waitForMigrations:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

workers:
  celery:
    env:
      - name: KAGGLE_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: KAGGLE_API_TOKEN
      - name: ETL_POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: ETL_POSTGRES_HOST
      - name: ETL_POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: ETL_POSTGRES_PORT
      - name: ETL_POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: ETL_POSTGRES_DB
      - name: ETL_POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: ETL_POSTGRES_USER
      - name: ETL_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: polaris-etl-secrets
            key: ETL_POSTGRES_PASSWORD
      - name: KAGGLE_CONFIG_DIR
        value: "/tmp/kaggle-config"
      - name: AIRFLOW_PROJECT_ROOT
        value: "/opt/airflow"
    extraVolumes:
      - name: etl-data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    extraVolumeMounts:
      - name: etl-data
        mountPath: /opt/airflow/data
      - name: tmp
        mountPath: /tmp
    logGroomerSidecar:
      securityContexts:
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 50000
          capabilities:
            drop:
              - ALL
    waitForMigrations:
      securityContexts:
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 50000
          capabilities:
            drop:
              - ALL
    securityContexts:
      pod:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL

createUserJob:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  securityContexts:
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

migrateDatabaseJob:
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  securityContexts:
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 50000
      capabilities:
        drop:
          - ALL

# Reducir permisos de la SA que el scheduler usa para lanzar tasks (mitiga ksv053).
# Quita el permiso sobre pods/exec, que es el vector de escalación a cluster-admin.
extraExecEnv: |
  AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS_ON_FAILURE=True
