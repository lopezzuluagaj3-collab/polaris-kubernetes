      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  waitForMigrations:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 50000
        capabilities:
          drop:
            - ALL
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 0
      seccompProfile:
