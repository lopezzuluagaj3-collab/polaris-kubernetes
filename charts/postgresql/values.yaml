# PostgreSQL para POLARIS - namespace: data
# Instalar con: helm install postgres bitnami/postgresql -n data -f charts/postgresql/values.yaml

# Bitnami dejó de publicar tags versionados en docker.io/bitnami desde ago 2025.
# Usamos el repo legacy (sin updates, pero con los tags que necesitamos).
global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r2

auth:
  username: airflow
  database: airflow
  existingSecret: postgres-creds
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  extraEnvVars:
    - name: WAREHOUSE_DB_USER
      valueFrom:
        secretKeyRef:
          name: warehouse-creds
          key: username
    - name: WAREHOUSE_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: warehouse-creds
          key: password
    - name: WAREHOUSE_DB_NAME
      valueFrom:
        secretKeyRef:
          name: warehouse-creds
          key: database

  initdb:
    scripts:
      create-warehouse-db.sh: |
        #!/bin/bash
        set -e
        export PGPASSWORD="$(cat /opt/bitnami/postgresql/secrets/postgres-password)"
        psql -v ON_ERROR_STOP=1 --username "postgres" <<-EOSQL
          SELECT 'CREATE DATABASE "${WAREHOUSE_DB_NAME}"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${WAREHOUSE_DB_NAME}')\gexec

          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${WAREHOUSE_DB_USER}') THEN
              CREATE USER "${WAREHOUSE_DB_USER}" WITH PASSWORD '${WAREHOUSE_DB_PASSWORD}';
            END IF;
          END
          \$\$;

          GRANT ALL PRIVILEGES ON DATABASE "${WAREHOUSE_DB_NAME}" TO "${WAREHOUSE_DB_USER}";
        EOSQL

# Métricas para que Prometheus las scrapee (namespace monitoring)
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
